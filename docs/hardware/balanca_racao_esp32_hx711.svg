<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .bg { fill: #f4f6f1; }
      .paper { fill: #ffffff; stroke: #c7d1c9; stroke-width: 2; }
      .soft { fill: #f8faf7; stroke: #d9e1da; stroke-width: 1.5; }
      .title { font-family: Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #153b2f; }
      .subtitle { font-family: Arial, sans-serif; font-size: 20px; fill: #52645b; }
      .section { font-family: Arial, sans-serif; font-size: 25px; font-weight: 800; fill: #153b2f; }
      .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1d332b; }
      .body { font-family: Arial, sans-serif; font-size: 16px; fill: #40564c; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #40564c; }
      .pin { font-family: Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #123528; }
      .tiny { font-family: Arial, sans-serif; font-size: 12px; fill: #40564c; }
      .module-esp { fill: #dcefe8; stroke: #1f7a5f; stroke-width: 2.5; }
      .module-hx { fill: #fff2cc; stroke: #b87910; stroke-width: 2.5; }
      .module-junction { fill: #eaf4ff; stroke: #3377b8; stroke-width: 2.5; }
      .module-app { fill: #172033; stroke: #0b1020; stroke-width: 2.5; }
      .wood-top { fill: #d8a65d; stroke: #8c5a21; stroke-width: 2; }
      .wood-base { fill: #b9823d; stroke: #744914; stroke-width: 2; }
      .cell { fill: #edf2f7; stroke: #52677f; stroke-width: 2; }
      .spacer { fill: #eef2f3; stroke: #93a1aa; stroke-width: 1.5; }
      .note { fill: #fff8e8; stroke: #d59018; stroke-width: 1.5; }
      .ok { fill: #eaf7f0; stroke: #2f8f62; stroke-width: 1.5; }
      .red { stroke: #df2424; }
      .black { stroke: #18202b; }
      .blue { stroke: #2563eb; }
      .yellow { stroke: #d49400; }
      .green { stroke: #16803c; }
      .white { stroke: #cfd8dc; }
      .gray { stroke: #7c8a86; }
      .wire { stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 7 7; }
    </style>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1f7a5f"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1200"/>

  <g transform="translate(56 42)">
    <text class="title" x="0" y="0" dominant-baseline="hanging">Balanca de racao conectada ao app</text>
    <text class="subtitle" x="0" y="58">Projeto economico com ESP32, modulo HX711, placa combinadora e 4 celulas de carga de 50 kg.</text>
  </g>

  <g transform="translate(56 132)">
    <rect class="paper" width="812" height="455" rx="18"/>
    <text class="section" x="30" y="30">1. Plataforma de pesagem</text>
    <text class="body" x="30" y="62">Estrutura sugerida para pesar balde, saco ou recipiente de mistura.</text>

    <g transform="translate(92 95)">
      <rect class="wood-base" x="45" y="250" width="570" height="42" rx="8"/>
      <rect class="spacer" x="86" y="218" width="22" height="44" rx="4"/>
      <rect class="spacer" x="552" y="218" width="22" height="44" rx="4"/>
      <rect class="wood-top" x="70" y="72" width="520" height="190" rx="10"/>
      <text class="label" x="257" y="104">TAMPO SUPERIOR</text>
      <text class="small" x="239" y="130">madeira, MDF ou chapa metalica</text>

      <rect class="cell" x="12" y="42" width="122" height="58" rx="9"/>
      <rect class="cell" x="526" y="42" width="122" height="58" rx="9"/>
      <rect class="cell" x="526" y="238" width="122" height="58" rx="9"/>
      <rect class="cell" x="12" y="238" width="122" height="58" rx="9"/>
      <text class="pin" x="48" y="77">CEL 1</text>
      <text class="pin" x="562" y="77">CEL 2</text>
      <text class="pin" x="562" y="273">CEL 3</text>
      <text class="pin" x="48" y="273">CEL 4</text>

      <rect x="270" y="150" width="120" height="70" rx="14" fill="#f8deb4" stroke="#99611f" stroke-width="2"/>
      <path d="M265 178 C265 138, 395 138, 395 178 C395 242, 265 242, 265 178 Z" fill="#f1c982" stroke="#99611f" stroke-width="2"/>
      <text class="small" x="288" y="247">recipiente de racao</text>
    </g>

    <rect class="note" x="30" y="404" width="752" height="34" rx="9"/>
    <text class="body" x="50" y="426">Use espacadores para a celula flexionar. Sem flexao, a leitura fica instavel.</text>
  </g>

  <g transform="translate(932 132)">
    <rect class="paper" width="812" height="455" rx="18"/>
    <text class="section" x="30" y="30">2. Eletronica principal</text>
    <text class="body" x="30" y="62">O ESP32 le o HX711 e envia o peso para o app por Wi-Fi local ou Bluetooth.</text>

    <g transform="translate(68 110)">
      <rect class="module-esp" x="0" y="0" width="245" height="260" rx="16"/>
      <text class="label" x="93" y="34">ESP32</text>
      <text class="small" x="74" y="58">Wi-Fi + Bluetooth</text>
      <text class="pin" x="28" y="112">3V3</text>
      <text class="pin" x="28" y="152">GND</text>
      <text class="pin" x="28" y="192">GPIO 4</text>
      <text class="pin" x="28" y="232">GPIO 5</text>

      <rect class="module-hx" x="435" y="0" width="245" height="260" rx="16"/>
      <text class="label" x="525" y="34">HX711</text>
      <text class="small" x="506" y="58">amplificador</text>
      <text class="pin" x="462" y="112">VCC</text>
      <text class="pin" x="462" y="152">GND</text>
      <text class="pin" x="462" y="192">DT / DOUT</text>
      <text class="pin" x="462" y="232">SCK / CLK</text>
      <text class="pin" x="620" y="102">E+</text>
      <text class="pin" x="620" y="132">E-</text>
      <text class="pin" x="620" y="162">A+</text>
      <text class="pin" x="620" y="192">A-</text>

      <path class="wire red" d="M112 108 L435 108"/>
      <path class="wire black" d="M112 148 L435 148"/>
      <path class="wire blue" d="M112 188 L435 188"/>
      <path class="wire yellow" d="M112 228 L435 228"/>
      <text class="tiny" x="250" y="99">alimentacao 3.3 V</text>
      <text class="tiny" x="250" y="139">terra comum</text>
      <text class="tiny" x="250" y="179">dados</text>
      <text class="tiny" x="250" y="219">clock</text>
    </g>

    <g transform="translate(70 392)">
      <rect class="ok" x="0" y="-28" width="330" height="44" rx="10"/>
      <text class="body" x="17" y="-1">Alimentar ESP32 por USB ou powerbank.</text>
      <rect class="module-app" x="510" y="-24" width="94" height="62" rx="14"/>
      <rect x="523" y="-13" width="68" height="40" rx="6" fill="#e0f6e9"/>
      <text class="pin" x="540" y="13">APP</text>
      <path class="thin gray dash" d="M245 -14 C335 42, 435 42, 510 9" marker-end="url(#arrowGreen)"/>
      <text class="small" x="326" y="60">Wi-Fi local ou Bluetooth</text>
    </g>
  </g>

  <g transform="translate(56 628)">
    <rect class="paper" width="1688" height="492" rx="18"/>
    <text class="section" x="30" y="30">3. Esquema limpo de ligacao das celulas de carga</text>
    <text class="body" x="30" y="62">Recomendado para o kit barato: 4 celulas de 3 fios entrando em uma placa combinadora. Da combinadora saem 4 fios para o HX711.</text>

    <g transform="translate(52 104)">
      <rect class="soft" x="0" y="0" width="450" height="320" rx="14"/>
      <text class="label" x="24" y="34">Sensores nos quatro cantos</text>
      <text class="small" x="24" y="60">Cada celula barata costuma ter 3 fios.</text>

      <rect class="cell" x="40" y="95" width="145" height="62" rx="10"/>
      <rect class="cell" x="265" y="95" width="145" height="62" rx="10"/>
      <rect class="cell" x="265" y="218" width="145" height="62" rx="10"/>
      <rect class="cell" x="40" y="218" width="145" height="62" rx="10"/>
      <text class="pin" x="89" y="123">CEL 1</text>
      <text class="tiny" x="69" y="145">R / W / B</text>
      <text class="pin" x="314" y="123">CEL 2</text>
      <text class="tiny" x="294" y="145">R / W / B</text>
      <text class="pin" x="314" y="246">CEL 3</text>
      <text class="tiny" x="294" y="268">R / W / B</text>
      <text class="pin" x="89" y="246">CEL 4</text>
      <text class="tiny" x="69" y="268">R / W / B</text>
    </g>

    <g transform="translate(590 104)">
      <rect class="module-junction" x="0" y="0" width="360" height="320" rx="16"/>
      <text class="label" x="82" y="36">PLACA COMBINADORA</text>
      <text class="small" x="91" y="62">load cell junction board</text>

      <line class="thin gray" x1="35" y1="95" x2="325" y2="95"/>
      <line class="thin gray" x1="35" y1="250" x2="325" y2="250"/>

      <text class="pin" x="36" y="124">S1</text>
      <text class="small" x="72" y="124">CEL 1</text>
      <text class="pin" x="36" y="164">S2</text>
      <text class="small" x="72" y="164">CEL 2</text>
      <text class="pin" x="36" y="204">S3</text>
      <text class="small" x="72" y="204">CEL 3</text>
      <text class="pin" x="36" y="244">S4</text>
      <text class="small" x="72" y="244">CEL 4</text>

      <text class="pin" x="276" y="122">E+</text>
      <text class="pin" x="276" y="158">E-</text>
      <text class="pin" x="276" y="194">A+</text>
      <text class="pin" x="276" y="230">A-</text>
    </g>

    <g transform="translate(1055 104)">
      <rect class="module-hx" x="0" y="44" width="240" height="232" rx="16"/>
      <text class="label" x="82" y="83">HX711</text>
      <text class="pin" x="32" y="130">E+</text>
      <text class="pin" x="32" y="168">E-</text>
      <text class="pin" x="32" y="206">A+</text>
      <text class="pin" x="32" y="244">A-</text>

      <rect class="module-esp" x="370" y="44" width="180" height="232" rx="16"/>
      <text class="label" x="430" y="83">ESP32</text>
      <text class="pin" x="402" y="130">3V3</text>
      <text class="pin" x="402" y="168">GND</text>
      <text class="pin" x="402" y="206">GPIO 4</text>
      <text class="pin" x="402" y="244">GPIO 5</text>
    </g>

    <path class="thin gray dash" d="M482 230 L590 228"/>
    <path class="thin gray dash" d="M482 270 L590 268"/>
    <path class="thin gray dash" d="M482 310 L590 308"/>
    <path class="thin gray dash" d="M482 350 L590 348"/>
    <text class="small" x="520" y="208">3 fios por celula</text>

    <path class="wire red" d="M902 226 L1055 226"/>
    <path class="wire black" d="M902 262 L1055 264"/>
    <path class="wire green" d="M902 298 L1055 302"/>
    <path class="wire white" d="M902 334 L1055 340"/>
    <text class="tiny" x="958" y="215">E+</text>
    <text class="tiny" x="958" y="253">E-</text>
    <text class="tiny" x="958" y="291">A+</text>
    <text class="tiny" x="958" y="329">A-</text>

    <path class="wire red" d="M1295 232 L1425 232"/>
    <path class="wire black" d="M1295 270 L1425 270"/>
    <path class="wire blue" d="M1295 308 L1425 308"/>
    <path class="wire yellow" d="M1295 346 L1425 346"/>
    <text class="tiny" x="1348" y="221">VCC</text>
    <text class="tiny" x="1348" y="259">GND</text>
    <text class="tiny" x="1348" y="297">DT</text>
    <text class="tiny" x="1348" y="335">SCK</text>

    <g transform="translate(1348 18)">
      <rect class="soft" x="0" y="0" width="286" height="84" rx="12"/>
      <text class="label" x="18" y="30">Legenda</text>
      <line class="wire red" x1="18" y1="55" x2="58" y2="55"/><text class="tiny" x="66" y="59">3V3 / E+</text>
      <line class="wire black" x1="142" y1="55" x2="182" y2="55"/><text class="tiny" x="190" y="59">GND / E-</text>
    </g>

    <rect class="note" x="30" y="438" width="1628" height="36" rx="9"/>
    <text class="body" x="50" y="462">Antes de soldar, confira a serigrafia da placa e o manual da celula. Cores podem variar por fabricante; depois calibre com peso conhecido.</text>
  </g>
</svg>
