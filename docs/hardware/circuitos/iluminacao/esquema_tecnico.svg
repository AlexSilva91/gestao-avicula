<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg{fill:#f4f7f5}.card{fill:#fff;stroke:#cbd8d1;stroke-width:2}.title{font:800 38px Arial;fill:#12382d}.sub{font:18px Arial;fill:#53665c}.h{font:800 24px Arial;fill:#12382d}.t{font:16px Arial;fill:#31483e}.s{font:13px Arial;fill:#53665c}.pin{font:800 15px Arial;fill:#122b24}.esp{fill:#dff4ec;stroke:#1c7a5a;stroke-width:3}.relay{fill:#fff0c7;stroke:#b1720f;stroke-width:3}.lamp{fill:#fff7cc;stroke:#d69400;stroke-width:3}.danger{fill:#fff0f0;stroke:#d93030;stroke-width:2}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#d72638}.black{stroke:#111827}.green{stroke:#16803c}.blue{stroke:#2563eb}.orange{stroke:#ea580c}.yellow{stroke:#d69400}.gray{stroke:#718096}.dash{stroke-dasharray:8 8}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="54" y="58">Circuito iluminacao - ESP32 + modulo rele 4 canais</text>
  <text class="sub" x="54" y="92">Mantem os canais atuais do app: Canal 1 GPIO23, Canal 2 GPIO22, Canal 3 GPIO21, Canal 4 GPIO19.</text>

  <rect class="card" x="72" y="140" width="1456" height="656" rx="18"/>
  <rect class="esp" x="116" y="220" width="300" height="430" rx="22"/>
  <text class="h" x="220" y="260">ESP32</text>
  <text class="pin" x="160" y="338">5V/VIN</text>
  <text class="pin" x="160" y="388">GND</text>
  <text class="pin" x="160" y="448">GPIO23</text>
  <text class="pin" x="160" y="508">GPIO22</text>
  <text class="pin" x="160" y="568">GPIO21</text>
  <text class="pin" x="160" y="628">GPIO19</text>

  <rect class="relay" x="560" y="190" width="360" height="520" rx="22"/>
  <text class="h" x="642" y="232">Modulo rele 4 canais</text>
  <text class="pin" x="600" y="332">VCC</text>
  <text class="pin" x="600" y="382">GND</text>
  <text class="pin" x="600" y="448">IN1</text>
  <text class="pin" x="600" y="508">IN2</text>
  <text class="pin" x="600" y="568">IN3</text>
  <text class="pin" x="600" y="628">IN4</text>
  <text class="pin" x="812" y="308">COM/NO 1</text>
  <text class="pin" x="812" y="398">COM/NO 2</text>
  <text class="pin" x="812" y="488">COM/NO 3</text>
  <text class="pin" x="812" y="578">COM/NO 4</text>

  <path class="wire red" d="M246 334H560"/>
  <path class="wire black" d="M246 384H560"/>
  <path class="wire green" d="M246 444H560"/>
  <path class="wire blue" d="M246 504H560"/>
  <path class="wire orange" d="M246 564H560"/>
  <path class="wire yellow" d="M246 624H560"/>

  <g transform="translate(1060 270)">
    <rect class="lamp" x="0" y="0" width="260" height="70" rx="16"/>
    <text class="pin" x="28" y="42">Lampada canal 1</text>
    <rect class="lamp" x="0" y="90" width="260" height="70" rx="16"/>
    <text class="pin" x="28" y="132">Lampada canal 2</text>
    <rect class="lamp" x="0" y="180" width="260" height="70" rx="16"/>
    <text class="pin" x="28" y="222">Lampada canal 3</text>
    <rect class="lamp" x="0" y="270" width="260" height="70" rx="16"/>
    <text class="pin" x="28" y="312">Lampada canal 4</text>
  </g>

  <path class="wire red" d="M920 306H1060"/>
  <path class="wire red" d="M920 396H1060"/>
  <path class="wire red" d="M920 486H1060"/>
  <path class="wire red" d="M920 576H1060"/>
  <path class="thin black" d="M1320 306H1430V576H1320"/>
  <path class="thin black" d="M1320 396H1430"/>
  <path class="thin black" d="M1320 486H1430"/>
  <text class="pin" x="1368" y="286">Neutro</text>
  <path class="thin red dash" d="M996 690H1428V306"/>
  <text class="pin" x="1000" y="724">Fase 127/220 V passa pelo COM/NO de cada rele</text>

  <rect class="danger" x="72" y="830" width="1456" height="110" rx="16"/>
  <text class="h" x="104" y="866">Rede eletrica</text>
  <text class="t" x="104" y="896">A parte 127/220 V nao deve ficar em protoboard. Use caixa IP65, bornes, fusivel/disjuntor, DPS/DR quando aplicavel e aterramento.</text>
  <text class="t" x="104" y="924">Se o modulo rele for 5 V, alimente VCC com 5 V e mantenha GND comum com o ESP32.</text>
</svg>
