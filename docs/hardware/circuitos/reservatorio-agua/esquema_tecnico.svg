<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg{fill:#f3f8fb}.card{fill:#fff;stroke:#cbd8d1;stroke-width:2}.title{font:800 38px Arial;fill:#102f3f}.sub{font:18px Arial;fill:#53665c}.h{font:800 23px Arial;fill:#102f3f}.t{font:16px Arial;fill:#31483e}.s{font:13px Arial;fill:#53665c}.pin{font:800 15px Arial;fill:#122b24}.esp{fill:#dff4ec;stroke:#1c7a5a;stroke-width:3}.sensor{fill:#e8f3ff;stroke:#2d6cdf;stroke-width:3}.warn{fill:#fff8e7;stroke:#c98218;stroke-width:2}.water{fill:#69c7f0;opacity:.72}.tank{fill:#f8fbff;stroke:#2579a8;stroke-width:4}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#d72638}.black{stroke:#111827}.blue{stroke:#2563eb}.green{stroke:#16803c}.purple{stroke:#7c3aed}.orange{stroke:#ea580c}.gray{stroke:#718096}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="54" y="58">Circuito reservatorio + qualidade da agua</text>
  <text class="sub" x="54" y="92">Leitura de nivel, temperatura, pH e TDS para a aba Reservatorio/Agua.</text>

  <rect class="card" x="64" y="136" width="412" height="694" rx="18"/>
  <text class="h" x="96" y="178">ESP32</text>
