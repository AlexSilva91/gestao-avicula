  </g>

  <rect class="sensor" x="1148" y="242" width="260" height="82" rx="16"/>
  <text class="pin" x="1176" y="278">Nivel analogico</text>
  <text class="s" x="1176" y="302">OUT -> GPIO34</text>

  <rect class="sensor" x="1148" y="360" width="260" height="82" rx="16"/>
  <text class="pin" x="1176" y="396">Temperatura agua</text>
  <text class="s" x="1176" y="420">OUT -> GPIO35</text>

  <rect class="sensor" x="1148" y="478" width="260" height="82" rx="16"/>
  <text class="pin" x="1176" y="514">Modulo pH</text>
  <text class="s" x="1176" y="538">AO -> GPIO36</text>

