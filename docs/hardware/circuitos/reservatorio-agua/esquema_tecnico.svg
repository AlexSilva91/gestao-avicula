  <rect class="warn" x="64" y="864" width="1472" height="86" rx="16"/>
  <text class="h" x="94" y="900">Cuidado com tensao analogica</text>
  <text class="t" x="94" y="930">As entradas GPIO34/35/36/39 do ESP32 aceitam no maximo 3.3 V. Se o modulo de pH/TDS sair em 5 V, use divisor/condicionamento ou ADS1115 adequado.</text>
