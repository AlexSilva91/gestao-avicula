  <text class="h" x="212" y="270">ESP32</text>
  <text class="pin" x="164" y="340">3V3</text>
  <text class="pin" x="164" y="390">GND</text>
  <text class="pin" x="164" y="448">GPIO34</text>
  <text class="pin" x="164" y="506">GPIO35</text>
  <text class="pin" x="164" y="564">GPIO36</text>
  <text class="pin" x="164" y="622">GPIO39</text>
  <text class="s" x="250" y="448">nivel</text>
  <text class="s" x="250" y="506">temperatura</text>
  <text class="s" x="250" y="564">pH</text>
  <text class="s" x="250" y="622">TDS/EC</text>

  <rect class="card" x="552" y="136" width="984" height="694" rx="18"/>
  <text class="h" x="584" y="178">Sensores no reservatorio</text>
  <g transform="translate(624 238)">
