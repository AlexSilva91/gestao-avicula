  <rect class="danger" x="72" y="846" width="1456" height="96" rx="16"/>
  <text class="h" x="104" y="882">Atencao</text>
  <text class="t" x="104" y="912">Desenho simplificado, igual ao modelo das luzes. Use rele e cabos dimensionados para a corrente real do ventilador.</text>
  <text class="t" x="104" y="934">Para motor 127/220 V maior, a montagem final deve ser validada por eletricista habilitado.</text>
